<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFill Pro</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --border: #252830;
      --accent: #4f8ef7;
      --accent-dim: #1e3a6e;
      --success: #34d399;
      --error: #f87171;
      --warn: #fbbf24;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --radius: 8px;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1a1f2e 0%, #0d0f14 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
    .header-sub { font-size: 11px; color: var(--text-muted); }

    /* ── Screens ──────────────────────────────────────────────────── */
    .screen { display: none; padding: 16px; animation: fadeIn 0.2s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Form elements ────────────────────────────────────────────── */
    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-muted); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: 9px 14px; border-radius: var(--radius);
      border: none; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.18s; letter-spacing: 0.2px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #3b7de8; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-success {
      background: var(--success);
      color: #065f46;
      font-size: 14px; padding: 11px;
    }
    .btn-success:hover { background: #10b981; }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }
    .btn + .btn { margin-top: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* ── Tab nav ──────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 2px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 3px; margin-bottom: 16px;
    }
    .tab {
      flex: 1; padding: 6px; text-align: center;
      border-radius: 6px; cursor: pointer; font-size: 12px;
      font-weight: 600; color: var(--text-muted);
      transition: all 0.18s; border: none; background: transparent;
    }
    .tab.active { background: var(--accent); color: #fff; }

    /* ── Status message ───────────────────────────────────────────── */
    .status {
      margin-top: 10px; padding: 8px 10px;
      border-radius: var(--radius); font-size: 12px;
      display: none; line-height: 1.4;
    }
    .status.show { display: block; }
    .status.ok { background: #064e3b; border: 1px solid #065f46; color: var(--success); }
    .status.err { background: #450a0a; border: 1px solid #7f1d1d; color: var(--error); }
    .status.warn { background: #451a03; border: 1px solid #78350f; color: var(--warn); }

    /* ── PIN screen ───────────────────────────────────────────────── */
    .pin-screen { text-align: center; padding: 24px 16px; }
    .pin-screen h2 { font-size: 17px; margin-bottom: 6px; }
    .pin-screen p { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; line-height: 1.5; }
    .pin-input-wrap { position: relative; margin: 0 auto 16px; max-width: 180px; }
    .pin-input-wrap input { text-align: center; font-size: 22px; letter-spacing: 8px; font-weight: 700; padding: 10px; }

    /* ── Section divider ──────────────────────────────────────────── */
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted);
      margin-bottom: 12px; padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Autofill screen ──────────────────────────────────────────── */
    .autofill-info {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 14px;
    }
    .autofill-info .field-preview {
      display: flex; justify-content: space-between;
      padding: 4px 0; border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .autofill-info .field-preview:last-child { border-bottom: none; }
    .field-preview .key { color: var(--text-muted); }
    .field-preview .val { color: var(--text); font-weight: 500; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .lock-icon { font-size: 36px; margin-bottom: 8px; }

    /* ── Change PIN link ──────────────────────────────────────────── */
    .link-btn {
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 12px; text-decoration: underline;
      margin-top: 8px; display: inline-block;
    }
    .custom-field-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 10px; margin-bottom: 6px;
      font-size: 12px;
    }
    .custom-field-item .cf-key { color: var(--text-muted); margin-right: 8px; min-width: 80px; }
    .custom-field-item .cf-val { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .custom-field-item .cf-del {
      background: none; border: none; color: var(--error);
      cursor: pointer; font-size: 14px; padding: 0 4px; flex-shrink: 0;
    }
    .custom-field-item .cf-del:hover { opacity: 0.7; }

  </style>
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-icon">⚡</div>
    <div>
      <div class="header-title">AutoFill Pro</div>
      <div class="header-sub">Rellena formularios al instante</div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════ -->
  <!-- SCREEN 1: Configurar PIN (primera vez) -->
  <!-- ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-setup-pin" class="screen pin-screen">
    <div class="lock-icon">🔐</div>
    <h2>Configura tu PIN</h2>
    <p>El PIN protege tus datos personales.<br>Mínimo 4 dígitos.</p>
    <div class="field-group pin-input-wrap">
      <input id="setup-pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="····" />
    </div>
    <div class="field-group pin-input-wrap">
      <input id="setup-pin-confirm" type="password" inputmode="numeric" maxlength="8" placeholder="Confirmar" />
    </div>
    <button class="btn btn-primary" id="btn-save-pin">Guardar PIN</button>
    <div id="status-setup-pin" class="status"></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════ -->
  <!-- SCREEN 2: Ingresar PIN (sesión) -->
  <!-- ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-verify-pin" class="screen pin-screen">
    <div class="lock-icon">🔒</div>
    <h2>Ingresa tu PIN</h2>
    <p>Ingresa tu PIN para acceder a tus datos y usar AutoFill.</p>
    <div class="field-group pin-input-wrap">
      <input id="verify-pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="····" autofocus />
    </div>
    <button class="btn btn-primary" id="btn-verify-pin">Desbloquear</button>
    <div id="status-verify-pin" class="status"></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════ -->
  <!-- SCREEN 3: Principal (datos + autofill) -->
  <!-- ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-main" class="screen">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="tab-autofill">⚡ AutoFill</button>
      <button class="tab" data-tab="tab-data">📝 Mis Datos</button>
    </div>

    <!-- ── Tab: AutoFill ──────────────────────────────────────────── -->
    <div id="tab-autofill" class="tab-content">
      <div class="section-title">Datos a rellenar</div>
      <div class="autofill-info" id="data-preview">
        <div style="color: var(--text-muted); font-size: 12px; text-align:center; padding: 8px 0;">
          No hay datos guardados aún
        </div>
      </div>
      <button class="btn btn-success" id="btn-autofill">⚡ Ejecutar AutoFill</button>
      <button class="btn btn-ghost" id="btn-lock">🔒 Bloquear sesión</button>
      <div id="status-autofill" class="status"></div>
    </div>

    <!-- ── Tab: Mis Datos ─────────────────────────────────────────── -->
    <div id="tab-data" class="tab-content" style="display:none;">
      <div class="section-title">Datos personales</div>

      <div class="row-2">
        <div class="field-group">
          <label>Nombre</label>
          <input type="text" id="f-nombre" placeholder="Juan" />
        </div>
        <div class="field-group">
          <label>Apellido</label>
          <input type="text" id="f-apellido" placeholder="Pérez" />
        </div>
      </div>

      <div class="field-group">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="juan@ejemplo.com" />
      </div>

      <div class="row-2">
        <div class="field-group">
          <label>Teléfono</label>
          <input type="tel" id="f-telefono" placeholder="+57 300..." />
        </div>
        <div class="field-group">
          <label>Documento / DNI</label>
          <input type="text" id="f-documento" placeholder="12345678" />
        </div>
      </div>

      <div class="field-group">
        <label>Dirección</label>
        <input type="text" id="f-direccion" placeholder="Calle 123 #45-67" />
      </div>

      <div class="row-2">
        <div class="field-group">
          <label>Ciudad</label>
          <input type="text" id="f-ciudad" placeholder="Bogotá" />
        </div>
        <div class="field-group">
          <label>País</label>
          <input type="text" id="f-pais" placeholder="Colombia" />
        </div>
      </div>

      <div class="field-group">
        <label>Código Postal</label>
        <input type="text" id="f-codigoPostal" placeholder="110111" />
      </div>

      <!-- ── Campos personalizados ──────────────────────────────── -->
      <div class="section-title" style="margin-top:14px;">Campos personalizados</div>

      <!-- Lista de campos añadidos -->
      <div id="custom-fields-list"></div>

      <!-- Formulario para añadir nuevo campo -->
      <div id="add-field-form" style="display:none;">
        <div class="row-2">
          <div class="field-group">
            <label>Nombre del parámetro</label>
            <input type="text" id="new-field-key" placeholder="ej: fax" />
          </div>
          <div class="field-group">
            <label>Valor</label>
            <input type="text" id="new-field-value" placeholder="ej: +57 1 234..." />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="btn-confirm-add-field" style="flex:1;">✅ Confirmar</button>
          <button class="btn btn-ghost" id="btn-cancel-add-field" style="flex:1;">Cancelar</button>
        </div>
        <div id="status-custom-field" class="status"></div>
      </div>

      <button class="btn btn-ghost" id="btn-show-add-field" style="margin-bottom:8px;">➕ Añadir campo</button>

      <button class="btn btn-primary" id="btn-save-data">💾 Guardar datos</button>
      <button class="btn btn-ghost" id="btn-change-pin">🔑 Cambiar PIN</button>
      <div id="status-data" class="status"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
